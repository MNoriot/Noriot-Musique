<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réserver — Noriot Musique</title>
  <meta name="description" content="Réservez votre cours d'essai gratuit avec Martin Noriot. Piano, trompette, guitare, basse à Aix-en-Provence.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Fond simple et calme pour la page de réservation */
    body {
      /* Fond doux pour la page de réservation */
      background: linear-gradient(135deg, #f8f4f0 0%, #fce4ec 50%, #fcf3cf 100%);
      min-height: 100vh;
    }

    .reserver-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 20px 0;
    }

    .reserver-card {
      background: rgba(255,255,255,0.98);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .reserver-card h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .reserver-card > p {
      color: var(--gris);
      margin-bottom: 28px;
      font-size: 1.05rem;
    }

    .form-embed {
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid #eee;
      background: var(--blanc);
      margin-bottom: 0;
    }

    .form-embed iframe {
      width: 100%;
      height: 1200px;
      border: 0;
      display: block;
    }

    .reserver-footer {
      text-align: center;
      padding: 20px;
      color: var(--gris);
      font-size: 0.9rem;
    }

    .reserver-footer a {
      color: var(--orange);
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .reserver-wrap {
        padding: 20px 40px 0;
      }

      .reserver-card {
        padding: 12px;
      }
    }
  </style>
<base target="_blank">
</head>

<body>
  <!-- Navigation flottante -->
  <a href="index.html" class="nav-float" aria-label="Retour à l'accueil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </a>

  <div class="reserver-wrap">
    <div class="reserver-card">
      <div class="form-embed" style="margin:0;">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfWGBMHQhvXIhTCJpxF9NNtjeamklKCjDSTXmyojnPrmg9osw/viewform?embedded=true" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
          Chargement…
        </iframe>
      </div>
    </div>
  </div>

  <!-- Footer centré et joli -->
  <footer class="site-footer" style="margin-top:24px; padding-bottom:40px;">
    <div style="max-width:800px; margin:0 auto; text-align:center; padding:0 20px;">
      <p style="color:var(--gris); font-size:0.95rem; margin-bottom:16px; line-height:1.6;">
        💡 Tu préfères échanger directement ?<br>
        martin@noriot.fr • 06 66 80 92 89
      </p>
      <div class="footer-links" style="justify-content:center; gap:20px;">
        <a href="https://www.instagram.com/noriot.music/" target="_blank" rel="noopener">📸 Instagram</a>
      </div>
    </div>
    <div class="footer-bottom" style="margin-top:20px;">
      © 2026 Noriot Musique
    </div>
  </footer>

</body>
</html>
